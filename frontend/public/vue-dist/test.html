<!DOCTYPE html>
<html>
<head>
    <title>Test Places Search</title>
</head>
<body>
    <h1>Test Places Search API</h1>
    <button onclick="testSearch()">Test Search Cafe</button>
    <div id="results"></div>

    <script>
        async function testSearch() {
            try {
                const response = await fetch('/api/places/search?query=cafe&lat=10.762622&lng=106.660172&radius=2000');
                const data = await response.json();
                console.log('API Response:', data);

                const resultsDiv = document.getElementById('results');
                if (data.places && data.places.length > 0) {
                    resultsDiv.innerHTML = '<h2>Found ' + data.places.length + ' places:</h2>';
                    data.places.slice(0, 10).forEach((place, index) => {
                        resultsDiv.innerHTML += `
                            <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                                <h3>${index + 1}. ${place.name} (${place.typeLabel})</h3>
                                <p>Priority: ${place.priority} | Source: ${place.source}</p>
                                <p>Address: ${place.address}</p>
                                <p>Distance: ${place.distance}m</p>
                            </div>
                        `;
                    });
                } else {
                    resultsDiv.innerHTML = '<p>No places found</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
